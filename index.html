<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YWAM가덕 차량 사용 신청서</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bgDark: '#0f172a',
            card: '#1e293b',
            input: '#334155'
          }
        }
      }
    }
  </script>
  <style>
    .range-selected { background-color: rgba(16, 185, 129, 0.2); color: #34d399; }
    .range-start-end { background-color: #10b981 !important; color: #ffffff !important; font-weight: bold; }
  </style>
</head>
<body class="bg-bgDark text-gray-100 min-h-screen pb-12 font-sans antialiased">

  <!-- 수칙 모달 -->
  <div id="rulesModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-card w-full max-w-lg rounded-2xl border border-gray-700 shadow-2xl flex flex-col max-h-[90vh]">
      <div class="p-4 border-b border-gray-700 flex justify-between items-center">
        <h2 class="font-bold text-emerald-400 text-sm flex items-center gap-2">
          <i class="fa-solid fa-clipboard-check"></i>
          <span data-i18n="modalTitle">YWAM가덕 차량 사용 신청서</span>
        </h2>
        <button id="langToggleModal" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-600 text-emerald-300 font-semibold px-2.5 py-1 rounded-lg">
          🌐 <span id="modalLangLabel">ENG</span>
        </button>
      </div>
      <div id="rulesContent" class="p-4 overflow-y-auto space-y-3 text-xs">
        <!-- JS에서 동적 생성 -->
      </div>
      <div class="p-4 border-t border-gray-700 bg-gray-900/50 flex flex-col space-y-3">
        <label id="agreeLabel" class="flex items-center space-x-2 text-xs text-gray-500 cursor-not-allowed select-none">
          <input type="checkbox" id="agreeCheckbox" disabled class="rounded border-gray-600 text-emerald-500 focus:ring-emerald-500 cursor-not-allowed">
          <span id="agreeTextSpan" data-i18n="agreeTextWait">수칙을 숙지했으며 동의합니다 (5초 뒤 선택 가능)</span>
          <span id="timerBadge" class="ml-auto text-[10px] bg-gray-800 text-gray-400 border border-gray-700 px-2 py-0.5 rounded-full font-mono">5s Wait</span>
        </label>
        <button id="agreeRulesBtn" disabled class="w-full bg-gray-800 text-gray-500 font-bold py-3.5 rounded-xl text-xs transition-all flex items-center justify-center space-x-2 cursor-not-allowed border border-gray-700">
          <span data-i18n="agreeBtnWait">동의 후 확인 버튼을 눌러주세요</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 메인 헤더 -->
  <header class="bg-card/80 border-b border-gray-800 backdrop-blur sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="font-extrabold text-white text-base tracking-wide" data-i18n="headerTitle">가덕 YWAM BASE</h1>
        <p class="text-[11px] text-emerald-400 font-medium" data-i18n="headerSub">실시간 차량 예약 시스템</p>
      </div>
      <div class="flex items-center space-x-2">
        <span id="dbStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-gray-800 text-gray-400 border border-gray-700">Local Mode</span>
        <button id="langToggleHeader" class="text-xs bg-gray-800 hover:bg-gray-700 border border-gray-700 text-emerald-300 font-semibold px-2.5 py-1 rounded-lg">
          🌐 <span id="headerLangLabel">ENG</span>
        </button>
        <button id="openSettingsBtn" class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 text-xs">
          <i class="fa-solid fa-gear"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-md mx-auto px-4 pt-4 space-y-4">
    <!-- 탭 내비게이션 -->
    <div class="flex border-b border-gray-800 text-xs font-semibold">
      <button id="tabReserve" class="flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 font-bold" data-i18n="tabReserve">예약하기</button>
      <button id="tabList" class="flex-1 py-3 text-center text-gray-400 hover:text-gray-200" data-i18n="tabList">예약 현황</button>
    </div>

    <!-- 1. 예약 입력 화면 -->
    <div id="viewReserve" class="space-y-4">
      <div id="editBanner" class="hidden bg-amber-950/60 border border-amber-600/50 p-2.5 rounded-xl flex justify-between items-center text-xs text-amber-200">
        <span class="font-bold" data-i18n="editTitle">예약 수정 모드</span>
        <button id="cancelEditBtn" class="underline text-amber-400 hover:text-amber-300" data-i18n="cancelEdit">수정 취소</button>
      </div>

      <form id="reservationForm" class="space-y-4">
        <!-- 차량 선택 -->
        <div>
          <label class="block text-xs font-semibold text-gray-300 mb-1" data-i18n="labelVehicle">차량 선택</label>
          <select id="vehicleSelect" class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
            <option value="스타렉스 (12인승)">스타렉스 (12인승)</option>
            <option value="카니발 (9인승)">카니발 (9인승)</option>
            <option value="포터 탑차">포터 탑차</option>
          </select>
        </div>

        <!-- 달력 -->
        <div class="bg-card p-3.5 rounded-xl border border-gray-800 space-y-2">
          <div class="flex justify-between items-center text-xs">
            <button type="button" id="prevMonth" class="p-1.5 text-gray-400 hover:text-white"><i class="fa-solid fa-chevron-left"></i></button>
            <span id="currentMonthStr" class="font-bold text-emerald-400"></span>
            <button type="button" id="nextMonth" class="p-1.5 text-gray-400 hover:text-white"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div id="calendarWeekDays" class="grid grid-cols-7 text-center text-[11px] text-gray-400 font-semibold py-1"></div>
          <div id="calendarDays" class="grid grid-cols-7 gap-1"></div>
          <div id="rangeSelectHint" class="text-[11px] text-center text-emerald-300 pt-1 font-medium"></div>
        </div>

        <!-- 시간 선택 -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelStartTime">출발 시각</label>
            <select id="startTimeSelect" class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"></select>
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelEndTime">반납 시각</label>
            <select id="endTimeSelect" class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"></select>
          </div>
        </div>

        <!-- 신청자 정보 -->
        <div class="space-y-2.5 bg-card p-3.5 rounded-xl border border-gray-800">
          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelApplicant">신청자 성함</label>
            <input type="text" id="userName" required class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>

          <!-- 실제 운전자 상이 체크박스 -->
          <div class="pt-1">
            <label class="flex items-center space-x-2 text-xs text-amber-300 cursor-pointer select-none">
              <input type="checkbox" id="differentDriverCheck" class="rounded border-gray-700 text-emerald-500 focus:ring-emerald-500">
              <span data-i18n="labelDiffDriver">실제 운전자가 다른 경우</span>
            </label>
          </div>

          <div id="actualDriverContainer" class="hidden space-y-2 pl-2 border-l-2 border-amber-500/50 pt-1">
            <div>
              <label class="block text-[11px] font-semibold text-amber-200 mb-1" data-i18n="labelActualDriver">실제 운전자 성함</label>
              <input type="text" id="actualDriverName" class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
            <div>
              <input type="tel" id="actualDriverPhone" placeholder="실제 운전자 연락처 (010-0000-0000)" class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelDept">소속 팀 / 단체</label>
            <input type="text" id="userDept" class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelPhone">신청자 연락처</label>
            <input type="tel" id="userPhone" required class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelPurpose">운행 목적 및 목적지</label>
            <input type="text" id="userPurpose" required class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          </div>

          <div>
            <label class="block text-[11px] font-semibold text-gray-300 mb-1" data-i18n="labelPassword">비밀번호</label>
            <input type="password" id="userPassword" required class="w-full bg-input border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
            <p class="text-[10px] text-gray-400 mt-1" data-i18n="passwordHint">※ 예약 수정/취소용 비밀번호</p>
          </div>
        </div>

        <button type="submit" id="submitFormBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl text-xs transition-all shadow-lg cursor-pointer" data-i18n="btnSubmit">
          차량 예약 신청하기
        </button>
      </form>

      <!-- 후원 계좌 안내 -->
      <div class="bg-card/60 p-3.5 rounded-xl border border-gray-800 space-y-1.5 text-xs text-center">
        <div class="font-bold text-emerald-400 flex items-center justify-center gap-1">
          <i class="fa-solid fa-heart"></i> <span data-i18n="donationTitle">차량 유지 및 운영 후원 계좌</span>
        </div>
        <div class="font-mono text-emerald-200 font-semibold bg-emerald-950/40 py-2 rounded-lg border border-emerald-800/50">
          국민은행 701801-04-113534<br>
          <span class="text-[11px] text-gray-300 font-normal">(사)아이더블유티코리아</span>
        </div>
        <p class="text-[10px] text-gray-400" data-i18n="donationSub">※ 보내주시는 후원금은 오직 차량 정비 및 안전 운행을 위해 사용됩니다.</p>
      </div>
    </div>

    <!-- 2. 예약 목록 화면 -->
    <div id="viewList" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="font-bold text-xs text-gray-300" data-i18n="listTitle">실시간 전체 예약 현황</h3>
        <span id="totalResCount" class="text-[11px] text-emerald-400 font-semibold"></span>
      </div>
      <div id="reservationListContainer" class="space-y-2.5"></div>
    </div>
  </main>

  <!-- 설정 모달 -->
  <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-card w-full max-w-md rounded-2xl border border-gray-700 p-4 space-y-3 text-xs">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h3 class="font-bold text-emerald-400">시스템 설정 (Google Chat / Firebase)</h3>
        <button id="closeSettingsBtn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div>
        <label class="block text-gray-300 font-semibold mb-1">Google Chat Webhook URL</label>
        <input type="text" id="webhookInput" class="w-full bg-input border border-gray-700 rounded-lg px-2.5 py-1.5 text-[11px] text-white">
      </div>
      <div>
        <label class="block text-gray-300 font-semibold mb-1">Firebase Config (JSON)</label>
        <textarea id="firebaseConfigInput" rows="5" class="w-full bg-input border border-gray-700 rounded-lg p-2 text-[10px] font-mono text-white"></textarea>
      </div>
      <button id="saveSettingsBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-lg">설정 저장 및 새로고침</button>
    </div>
  </div>

  <script>

    const i18n = {

        rulesHtml: `
          <div class="bg-emerald-950/30 p-3 rounded-xl border border-emerald-800/40 text-emerald-200 text-[11px] leading-relaxed">
            하나님의 선교에 동참하시는 동역자 여러분을 환영합니다.<br>
            YWAM 가덕의 차량은 사역을 위해 자비량으로 운영&관리되며, 제출해 주시는 사용 재정은 차량의 안전 운행과 유지 관리 목적으로만 사용됩니다.

            <div class="bg-input/60 p-2.5 rounded-lg border border-gray-800">

            <div class="bg-amber-950/40 p-2.5 rounded-lg border border-amber-700/50 text-amber-200">

            </div>
          </div>

        db.ref("ywam_reservations").on("value", (snapshot) => {

    function parseTimeMs(dateStr, timeStr) {
      if (!dateStr || !timeStr) return 0;
      if (timeStr === "24:00") {
        const d = new Date(`${dateStr}T00:00:00`);
        d.setDate(d.getDate() + 1);
        return d.getTime();
      }
      return new Date(`${dateStr}T${timeStr}:00`).getTime();
    }

    function renderTimeSelects() {
      startTimeSelect.innerHTML = timeSlots.slice(0, -1).map(t => `<option value="${t}">${t}</option>`).join('');
      endTimeSelect.innerHTML = timeSlots.slice(1).map(t => `<option value="${t}">${t}</option>`).join('');
      startTimeSelect.value = "09:00";
      endTimeSelect.value = "18:00";
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      currentMonthStr.textContent = `${year}.${String(month + 1).padStart(2, '0')}`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      calendarDays.innerHTML = "";

      for (let i = 0; i < firstDay; i++) {
        calendarDays.appendChild(document.createElement("div"));
      }

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        const dayEl = document.createElement("button");
        dayEl.type = "button";
        dayEl.textContent = d;
        dayEl.className = "p-2 rounded-lg transition-all text-center text-xs font-semibold hover:bg-gray-700/50";

        if (startDateStr && endDateStr && dateStr >= startDateStr && dateStr <= endDateStr) {
          if (dateStr === startDateStr || dateStr === endDateStr) {
            dayEl.className += " range-start-end shadow-md";
          } else {
            dayEl.className += " range-selected";
          }
        } else if (startDateStr && dateStr === startDateStr) {
          dayEl.className += " range-start-end shadow-md";
        }

        const currentVehicle = vehicleSelect.value;
        const hasRes = reservations.some(r => r.vehicle === currentVehicle && dateStr >= r.startDate && dateStr <= r.endDate);
        if (hasRes) {
          const dot = document.createElement("div");
          dot.className = "w-1.5 h-1.5 bg-emerald-400 rounded-full mx-auto mt-0.5";
          dayEl.appendChild(dot);
        }

        dayEl.addEventListener("click", () => selectCalendarDate(dateStr));
        calendarDays.appendChild(dayEl);
      }

      updateRangeHint();
    }

    function selectCalendarDate(dateStr) {
      if (!startDateStr || (startDateStr && endDateStr)) {
        startDateStr = dateStr;
        endDateStr = null;
      } else if (startDateStr && !endDateStr) {
        if (dateStr < startDateStr) {
          startDateStr = dateStr;
        } else {
          endDateStr = dateStr;
        }
      }
      renderCalendar();
      updateTimeSelectOptions();
    }

    function updateRangeHint() {
      const t = i18n[currentLang];
      if (!startDateStr) {
        rangeSelectHint.textContent = t.hintSelectStart;
      } else if (startDateStr && !endDateStr) {
        rangeSelectHint.textContent = `${startDateStr} ${t.hintSelectEnd}`;
      } else {
        rangeSelectHint.textContent = `${t.hintRangeSelected} ${startDateStr} ~ ${endDateStr}`;
      }
    }

    function updateTimeSelectOptions() {
      if (startDateStr && endDateStr && startDateStr === endDateStr) {
        const startVal = startTimeSelect.value;
        const startIdx = timeSlots.indexOf(startVal);
        Array.from(endTimeSelect.options).forEach(opt => {
          const optIdx = timeSlots.indexOf(opt.value);
          opt.disabled = optIdx <= startIdx;
        });
        if (timeSlots.indexOf(endTimeSelect.value) <= startIdx) {
          endTimeSelect.value = timeSlots[startIdx + 1] || "24:00";
        }
      } else {
        Array.from(endTimeSelect.options).forEach(opt => opt.disabled = false);
      }
    }

    function checkOverlap(vehicle, startMs, endMs, excludeId = null) {
      return reservations.some(r => {
        if (r.vehicle !== vehicle) return false;
        if (excludeId && (r.id === excludeId || r.fbKey === excludeId)) return false;
        const rStart = parseTimeMs(r.startDate, r.startTime);
        const rEnd = parseTimeMs(r.endDate, r.endTime);
        return startMs < rEnd && endMs > rStart;
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      if (!startDateStr) {
        alert(currentLang === 'ko' ? "시작 날짜를 선택해주세요." : "Please select a start date.");
        return;
      }
      const actualEndDate = endDateStr || startDateStr;
      const startMs = parseTimeMs(startDateStr, startTimeSelect.value);
      const endMs = parseTimeMs(actualEndDate, endTimeSelect.value);

      if (startMs >= endMs) {
        alert(currentLang === 'ko' ? "반납 시각은 출발 시각보다 이후여야 합니다." : "End time must be after start time.");
        return;
      }

      const currentVehicle = vehicleSelect.value;
      const excludeId = editingResTarget ? (editingResTarget.fbKey || editingResTarget.id) : null;

      if (checkOverlap(currentVehicle, startMs, endMs, excludeId)) {
        alert(currentLang === 'ko' ? "선택하신 시간대에 이미 예약이 존재합니다. 다른 시간을 선택해주세요." : "A reservation already exists for this timeframe.");
        return;
      }

      const diffDriver = document.getElementById("differentDriverCheck").checked;
      const formData = {
        id: editingResTarget ? editingResTarget.id : Date.now().toString(),
        vehicle: currentVehicle,
        startDate: startDateStr,
        endDate: actualEndDate,
        startTime: startTimeSelect.value,
        endTime: endTimeSelect.value,
        userName: document.getElementById("userName").value.trim(),
        hasDiffDriver: diffDriver,
        actualDriverName: diffDriver ? document.getElementById("actualDriverName").value.trim() : "",
        actualDriverPhone: diffDriver ? document.getElementById("actualDriverPhone").value.trim() : "",
        userDept: document.getElementById("userDept").value.trim(),
        userPhone: document.getElementById("userPhone").value.trim(),
        userPurpose: document.getElementById("userPurpose").value.trim(),
        userPassword: document.getElementById("userPassword").value.trim(),
        createdAt: new Date().toISOString()
      };

      if (db) {
        if (editingResTarget && editingResTarget.fbKey) {
          await db.ref(`ywam_reservations/${editingResTarget.fbKey}`).update(formData);
        } else {
          await db.ref("ywam_reservations").push(formData);
        }
      } else {
        if (editingResTarget) {
          const idx = reservations.findIndex(r => r.id === editingResTarget.id);
          if (idx !== -1) reservations[idx] = formData;
        } else {
          reservations.push(formData);
        }
        localStorage.setItem("ywam_car_reservations_multi", JSON.stringify(reservations));
        renderCalendar();
        renderReservationList();
      }

      sendGoogleChatWebhook(formData, editingResTarget ? "UPDATE" : "NEW");
      alert(editingResTarget ? (currentLang === 'ko' ? "예약이 수정되었습니다." : "Reservation updated successfully.") : (currentLang === 'ko' ? "차량 예약 신청이 완료되었습니다." : "Reservation submitted successfully."));
      resetEditMode();
      reservationForm.reset();
      startDateStr = null;
      endDateStr = null;
      renderCalendar();
      switchTab('list');
    }

      const sorted = [...reservations].sort((a, b) => parseTimeMs(b.startDate, b.startTime) - parseTimeMs(a.startDate, a.startTime));

                <button onclick="deleteReservation('${r.id}')" class="text-xs bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/50 px-2 py-1 rounded">${currentLang === 'ko' ? '삭제' : 'Delete'}</button>
              </div>
            </div>
            
            <div class="text-gray-300 space-y-0.5 bg-input/40 p-2.5 rounded-lg border border-gray-800/80 text-[11px]">

              <div><i class="fa-solid fa-phone mr-1 text-gray-400"></i> ${r.userPhone}</div>
              ${r.hasDiffDriver ? `<div class="text-amber-300"><i class="fa-solid fa-id-card mr-1"></i> ${currentLang === 'ko' ? '실제운전자' : 'Actual Driver'}: ${r.actualDriverName} (${r.actualDriverPhone})</div>` : ''}
              <div><i class="fa-solid fa-location-dot mr-1 text-gray-400"></i> ${r.userPurpose}</div>
            </div>
          </div>
        `;
      }).join('');

    window.editReservation = function(id) {
      const target = reservations.find(r => r.id === id || r.fbKey === id);
      if (!target) return;

      const inputPwd = prompt(currentLang === 'ko' ? "예약 작성 시 설정한 비밀번호를 입력하세요:" : "Enter your password:");
      if (inputPwd !== target.userPassword) {
        alert(currentLang === 'ko' ? "비밀번호가 일치하지 않습니다." : "Incorrect password.");
        return;
      }

      editingResTarget = target;
      vehicleSelect.value = target.vehicle;
      startDateStr = target.startDate;
      endDateStr = target.endDate;
      startTimeSelect.value = target.startTime;
      endTimeSelect.value = target.endTime;

      document.getElementById("userName").value = target.userName;
      document.getElementById("userDept").value = target.userDept || "";
      document.getElementById("userPhone").value = target.userPhone;
      document.getElementById("userPurpose").value = target.userPurpose;
      document.getElementById("userPassword").value = target.userPassword;

      if (target.hasDiffDriver) {
        document.getElementById("differentDriverCheck").checked = true;
        document.getElementById("actualDriverContainer").classList.remove("hidden");
        document.getElementById("actualDriverName").value = target.actualDriverName || "";
        document.getElementById("actualDriverPhone").value = target.actualDriverPhone || "";
      }

      document.getElementById("editBanner").classList.remove("hidden");
      document.getElementById("submitFormBtn").textContent = currentLang === 'ko' ? "예약 수정 완료하기" : "Complete Reservation Edit";
      renderCalendar();
      switchTab('reserve');
    };

    window.deleteReservation = async function(id) {
      const target = reservations.find(r => r.id === id || r.fbKey === id);
      if (!target) return;

      const inputPwd = prompt(currentLang === 'ko' ? "예약 삭제를 위해 비밀번호를 입력하세요:" : "Enter your password to delete:");
      if (inputPwd !== target.userPassword) {
        alert(currentLang === 'ko' ? "비밀번호가 일치하지 않습니다." : "Incorrect password.");
        return;
      }

      if (!confirm(currentLang === 'ko' ? "정말 이 예약을 삭제하시겠습니까?" : "Are you sure you want to delete this reservation?")) return;

      if (db && target.fbKey) {
        await db.ref(`ywam_reservations/${target.fbKey}`).remove();
      } else {
        reservations = reservations.filter(r => r.id !== id);
        localStorage.setItem("ywam_car_reservations_multi", JSON.stringify(reservations));
        renderCalendar();
        renderReservationList();
      }

      sendGoogleChatWebhook(target, "DELETE");
      alert(currentLang === 'ko' ? "예약이 삭제되었습니다." : "Reservation deleted successfully.");
    };

    function saveSettings() {
      const configStr = document.getElementById("firebaseConfigInput").value.trim();
      const webhookStr = document.getElementById("webhookInput").value.trim();

      if (configStr) localStorage.setItem("firebase_config", configStr);
      if (webhookStr) localStorage.setItem("google_chat_webhook", webhookStr);

      webhookUrl = webhookStr;
      firebaseConfigRaw = configStr;

      alert(currentLang === 'ko' ? "설정이 저장되었습니다. 페이지를 새로고침합니다." : "Settings saved. Reloading page.");
      location.reload();
    }

    async function sendGoogleChatWebhook(data, type) {
      if (!webhookUrl) return;

      let titlePrefix = "🚗 [새로운 차량 예약 신청]";
      if (type === "UPDATE") titlePrefix = "✏️ [차량 예약 변경 안내]";
      if (type === "DELETE") titlePrefix = "🗑️ [차량 예약 취소 안내]";

      const payload = {
        text: `${titlePrefix}\n` +
              `• 차량: ${data.vehicle}\n` +
              `• 신청자: ${data.userName} (${data.userDept || '소속 미지정'})\n` +
              `• 연락처: ${data.userPhone}\n` +
              (data.hasDiffDriver ? `• 실제운전자: ${data.actualDriverName} (${data.actualDriverPhone})\n` : '') +
              `• 일정: ${data.startDate} ${data.startTime} ~ ${data.endDate} ${data.endTime}\n` +
              `• 목적지/사유: ${data.userPurpose}`
      };

      try {
        await fetch(webhookUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json; charset=UTF-8" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Webhook 전송 실패:", err);
      }
    }
  </script>
