<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가덕 YWAM BASE 차량 예약</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body { background-color: #121212; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .bg-card { background-color: #1e1e1e; }
    .bg-input { background-color: #2c2c2c; }
    .accent-green { background-color: #00c853; color: #ffffff; }
    .accent-green-hover:hover { background-color: #00e676; }
    .range-selected { background-color: rgba(0, 200, 83, 0.25); color: #00c853; font-weight: bold; }
    .range-start-end { background-color: #00c853 !important; color: #ffffff !important; font-weight: bold; }
  </style>
</head>
<body class="max-w-md mx-auto min-h-screen flex flex-col pb-10 border-x border-gray-800 shadow-2xl">

  <!-- Header -->
  <header class="p-4 border-b border-gray-800 flex items-center justify-between sticky top-0 bg-[#121212] bg-opacity-95 backdrop-blur z-20">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-van-shuttle text-emerald-400 text-xl"></i>
      <div>
        <h1 class="font-bold text-base text-white leading-tight">가덕 YWAM BASE</h1>
        <p class="text-[11px] text-gray-400">실시간 차량 예약 시스템</p>
      </div>
    </div>
    <div class="flex items-center space-x-1">
      <span id="dbStatusBadge" class="text-[10px] px-2 py-0.5 rounded-full bg-yellow-900/60 text-yellow-300 border border-yellow-700/50">로컬 저장소</span>
      <button id="openSettingsBtn" class="text-gray-400 hover:text-white p-2">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="flex border-b border-gray-800 text-sm font-medium">
    <button id="tabReserve" class="flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 font-bold">예약하기</button>
    <button id="tabList" class="flex-1 py-3 text-center text-gray-400 hover:text-gray-200">예약 현황</button>
  </div>

  <!-- VIEW 1: Reservation Form -->
  <main id="viewReserve" class="p-4 space-y-5 flex-1">
    
    <!-- Vehicle Selection -->
    <div>
      <label class="block text-xs text-gray-400 mb-1.5 font-semibold">차량 선택</label>
      <select id="vehicleSelect" class="w-full bg-input text-white text-sm rounded-lg p-3 border border-gray-700 focus:outline-none focus:border-emerald-500">
        <option value="카니발 (승합차)">카니발 (승합차)</option>
        <option value="트럭 (화물차)">트럭 (화물차)</option>
      </select>
    </div>

    <!-- Calendar Range Picker -->
    <div class="bg-card p-3 rounded-xl border border-gray-800">
      <div class="flex items-center justify-between mb-3 px-1">
        <button id="prevMonth" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-chevron-left"></i></button>
        <span id="currentMonthStr" class="font-bold text-sm text-gray-200">2026.09</span>
        <button id="nextMonth" class="text-gray-400 hover:text-white p-1"><i class="fa-solid fa-chevron-right"></i></button>
      </div>

      <div class="grid grid-cols-7 text-center text-xs text-gray-400 font-medium mb-1">
        <span class="text-red-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>

      <div id="calendarDays" class="grid grid-cols-7 gap-1 text-center text-xs">
        <!-- JS Calendar -->
      </div>
      
      <p class="text-[11px] text-gray-400 text-center mt-2.5 bg-input/50 py-1.5 rounded-lg border border-gray-800">
        💡 <span id="rangeSelectHint">시작일을 클릭한 후 반납일을 클릭하세요.</span>
      </p>
    </div>

    <!-- Start / End Time Selection -->
    <div class="grid grid-cols-2 gap-3 bg-card p-3 rounded-xl border border-gray-800">
      <div>
        <label class="block text-[11px] text-emerald-400 mb-1 font-semibold">출발 시각 (시작일)</label>
        <select id="startTimeSelect" class="w-full bg-input text-white text-xs rounded-lg p-2.5 border border-gray-700 focus:outline-none focus:border-emerald-500">
          <!-- JS Times -->
        </select>
      </div>
      <div>
        <label class="block text-[11px] text-emerald-400 mb-1 font-semibold">반납 시각 (종료일)</label>
        <select id="endTimeSelect" class="w-full bg-input text-white text-xs rounded-lg p-2.5 border border-gray-700 focus:outline-none focus:border-emerald-500">
          <!-- JS Times -->
        </select>
      </div>
    </div>

    <!-- Reservation Form Details -->
    <form id="reservationForm" class="space-y-3.5">
      <div class="space-y-1">
        <label class="block text-xs text-gray-400">신청자 성함 <span class="text-emerald-500">*</span></label>
        <input type="text" id="userName" required placeholder="예: 홍길동 간사" class="w-full bg-input text-white text-sm rounded-lg p-2.5 border border-gray-700 focus:outline-none focus:border-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div class="space-y-1">
          <label class="block text-xs text-gray-400">소속 부서 / 팀</label>
          <input type="text" id="userDept" placeholder="예: BASE 관리팀" class="w-full bg-input text-white text-sm rounded-lg p-2.5 border border-gray-700 focus:outline-none focus:border-emerald-500">
        </div>
        <div class="space-y-1">
          <label class="block text-xs text-gray-400">연락처 <span class="text-emerald-500">*</span></label>
          <input type="tel" id="userPhone" required placeholder="010-0000-0000" class="w-full bg-input text-white text-sm rounded-lg p-2.5 border border-gray-700 focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div class="space-y-1">
        <label class="block text-xs text-gray-400">운행 목적 및 목적지 <span class="text-emerald-500">*</span></label>
        <textarea id="userPurpose" required rows="2" placeholder="예: 수련회 장소 답사 및 물품 수거" class="w-full bg-input text-white text-sm rounded-lg p-2.5 border border-gray-700 focus:outline-none focus:border-emerald-500"></textarea>
      </div>

      <button type="submit" class="w-full accent-green accent-green-hover font-bold py-3.5 rounded-xl shadow-lg text-sm mt-2 transition-all">
        차량 예약 신청하기
      </button>
    </form>
  </main>

  <!-- VIEW 2: Reservation List -->
  <main id="viewList" class="p-4 space-y-4 flex-1 hidden">
    <div class="flex justify-between items-center mb-1">
      <h2 class="text-sm font-bold text-gray-300">실시간 전체 예약 현황</h2>
      <span class="text-[11px] text-gray-500" id="totalResCount">총 0건</span>
    </div>
    <div id="reservationListContainer" class="space-y-3">
      <!-- JS List -->
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-card w-full max-w-xs rounded-2xl p-5 border border-gray-700 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-white text-sm">연동 설정 (Firebase & Webhook)</h3>
        <button id="closeSettingsBtn" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-2 border-b border-gray-800 pb-3">
        <p class="text-[11px] text-emerald-400 leading-relaxed font-semibold">
          🔥 Firebase Realtime Database 연동
        </p>
        <p class="text-[11px] text-gray-400">
          파이어베이스 콘솔에서 발급받은 Config JSON 문자열을 그대로 넣으시면 실시간 예약 공유가 가능합니다.
        </p>
        <textarea id="firebaseConfigInput" rows="4" placeholder='{"apiKey": "...", "databaseURL": "...", ...}' class="w-full bg-input text-white text-[10px] rounded-lg p-2 border border-gray-700 font-mono"></textarea>
      </div>

      <div class="space-y-2">
        <p class="text-[11px] text-emerald-400 leading-relaxed font-semibold">
          💬 Google Chat Webhook URL
        </p>
        <input type="url" id="webhookInput" placeholder="https://chat.googleapis.com/v1/spaces/..." class="w-full bg-input text-white text-xs rounded-lg p-2.5 border border-gray-700">
      </div>

      <button id="saveSettingsBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-xs">
        설정 저장하기
      </button>
    </div>
  </div>

  <script>
    // 기본 연동 정보 고정 설정
    const DEFAULT_FIREBASE_CONFIG = JSON.stringify({
      apiKey: "AIzaSyCFiOVg_XZWjQ7dTRe0EnfE81eBi0CHbM8",
      authDomain: "gd-base-vehicle-reservation.firebaseapp.com",
      databaseURL: "https://gd-base-vehicle-reservation-default-rtdb.firebaseio.com",
      projectId: "gd-base-vehicle-reservation",
      storageBucket: "gd-base-vehicle-reservation.firebasestorage.app",
      messagingSenderId: "464640567650",
      appId: "1:464640567650:web:6089ee1300453743f9643b",
      measurementId: "G-ZQWJQQRBK1"
    });

    // 내장된 구글 챗 Webhook URL
    const DEFAULT_WEBHOOK_URL = "https://chat.googleapis.com/v1/spaces/AAQAxpJfkLw/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=8VxRP6gPwmGQycEW8ig1Th-Pc6T6tNG3fqipRkuWp-A"; 

    let currentDate = new Date();
    let startDateStr = null;
    let endDateStr = null;
    let reservations = [];
    let db = null;

    let webhookUrl = localStorage.getItem("google_chat_webhook") || DEFAULT_WEBHOOK_URL;
    let firebaseConfigRaw = localStorage.getItem("firebase_config") || DEFAULT_FIREBASE_CONFIG;

    // Time Slots (08:00 - 21:00)
    const timeSlots = [];
    for (let h = 8; h <= 21; h++) {
      const hourStr = h < 10 ? `0${h}` : `${h}`;
      timeSlots.push(`${hourStr}:00`);
      timeSlots.push(`${hourStr}:30`);
    }

    const calendarDays = document.getElementById("calendarDays");
    const currentMonthStr = document.getElementById("currentMonthStr");
    const startTimeSelect = document.getElementById("startTimeSelect");
    const endTimeSelect = document.getElementById("endTimeSelect");
    const rangeSelectHint = document.getElementById("rangeSelectHint");
    const vehicleSelect = document.getElementById("vehicleSelect");
    const reservationForm = document.getElementById("reservationForm");

    document.addEventListener("DOMContentLoaded", () => {
      initFirebase();
      initTimeSelectors();
      renderCalendar();
      if (!db) {
        loadLocalReservations();
      }
      document.getElementById("webhookInput").value = webhookUrl;
      document.getElementById("firebaseConfigInput").value = firebaseConfigRaw;
    });

    // Firebase Initialization
    function initFirebase() {
      if (!firebaseConfigRaw) return;
      try {
        const config = JSON.parse(firebaseConfigRaw);
        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }
        db = firebase.database();
        document.getElementById("dbStatusBadge").textContent = "파이어베이스 실시간 공유중";
        document.getElementById("dbStatusBadge").className = "text-[10px] px-2 py-0.5 rounded-full bg-emerald-900/60 text-emerald-300 border border-emerald-700/50";

        // Realtime Sync
        db.ref("ywam_reservations").on("value", (snapshot) => {
          const data = snapshot.val();
          reservations = data ? Object.keys(data).map(key => ({ ...data[key], fbKey: key })) : [];
          renderCalendar();
          renderReservationList();
        });
      } catch (err) {
        console.error("Firebase Config Error:", err);
      }
    }

    function loadLocalReservations() {
      reservations = JSON.parse(localStorage.getItem("ywam_car_reservations_multi") || "[]");
      renderCalendar();
      renderReservationList();
    }

    function initTimeSelectors() {
      startTimeSelect.innerHTML = "";
      endTimeSelect.innerHTML = "";
      timeSlots.forEach(t => {
        startTimeSelect.innerHTML += `<option value="${t}">${t}</option>`;
        endTimeSelect.innerHTML += `<option value="${t}">${t}</option>`;
      });
      startTimeSelect.value = "09:00";
      endTimeSelect.value = "18:00";
    }

    function renderCalendar() {
      calendarDays.innerHTML = "";
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      currentMonthStr.textContent = `${year}.${String(month + 1).padStart(2, '0')}`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        calendarDays.appendChild(document.createElement("div"));
      }

      for (let day = 1; day <= lastDate; day++) {
        const dayBtn = document.createElement("button");
        dayBtn.type = "button";
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        
        dayBtn.textContent = day;
        dayBtn.className = "py-2 rounded-lg transition-all text-center flex flex-col items-center justify-center font-medium";

        if (startDateStr && !endDateStr && dateStr === startDateStr) {
          dayBtn.classList.add("range-start-end");
        } else if (startDateStr && endDateStr) {
          if (dateStr === startDateStr || dateStr === endDateStr) {
            dayBtn.classList.add("range-start-end");
          } else if (dateStr > startDateStr && dateStr < endDateStr) {
            dayBtn.classList.add("range-selected");
          } else {
            dayBtn.classList.add("hover:bg-gray-800", "text-gray-300");
          }
        } else {
          dayBtn.classList.add("hover:bg-gray-800", "text-gray-300");
        }

        dayBtn.addEventListener("click", () => handleDateClick(dateStr));
        calendarDays.appendChild(dayBtn);
      }

      if (!startDateStr) {
        rangeSelectHint.textContent = "시작일(출발일)을 선택해 주세요.";
      } else if (startDateStr && !endDateStr) {
        rangeSelectHint.textContent = `[${startDateStr}] 선택됨. 반납일(종료일)을 선택해 주세요.`;
      } else {
        rangeSelectHint.textContent = `선택된 기간: ${startDateStr} ~ ${endDateStr}`;
      }
    }

    function handleDateClick(dateStr) {
      if (!startDateStr || (startDateStr && endDateStr)) {
        startDateStr = dateStr;
        endDateStr = null;
      } else if (startDateStr && !endDateStr) {
        if (dateStr < startDateStr) {
          startDateStr = dateStr;
          endDateStr = null;
        } else {
          endDateStr = dateStr;
        }
      }
      renderCalendar();
    }

    reservationForm.addEventListener("submit", (e) => {
      e.preventDefault();

      if (!startDateStr) {
        alert("예약 시작일을 선택해 주세요.");
        return;
      }

      const finalEndDate = endDateStr || startDateStr;

      const newRes = {
        id: Date.now(),
        vehicle: vehicleSelect.value,
        startDate: startDateStr,
        startTime: startTimeSelect.value,
        endDate: finalEndDate,
        endTime: endTimeSelect.value,
        userName: document.getElementById("userName").value,
        dept: document.getElementById("userDept").value || "소속 미기재",
        phone: document.getElementById("userPhone").value,
        purpose: document.getElementById("userPurpose").value,
        createdAt: new Date().toISOString()
      };

      if (db) {
        db.ref("ywam_reservations").push(newRes);
      } else {
        reservations.push(newRes);
        localStorage.setItem("ywam_car_reservations_multi", JSON.stringify(reservations));
        renderReservationList();
      }

      sendGoogleChatWebhook(newRes, "CREATE");

      alert("차량 예약 신청이 완료되었습니다!");
      startDateStr = null;
      endDateStr = null;
      reservationForm.reset();
      renderCalendar();
    });

    function deleteReservation(resObj) {
      if (confirm(`[${resObj.vehicle}] ${resObj.startDate} ~ ${resObj.endDate} 예약을 정말 취소하시겠습니까?`)) {
        if (db && resObj.fbKey) {
          db.ref("ywam_reservations/" + resObj.fbKey).remove();
        } else {
          reservations = reservations.filter(r => r.id !== resObj.id);
          localStorage.setItem("ywam_car_reservations_multi", JSON.stringify(reservations));
          renderReservationList();
        }

        sendGoogleChatWebhook(resObj, "DELETE");
        alert("예약이 취소되었습니다.");
        renderCalendar();
      }
    }

    function sendGoogleChatWebhook(resData, type = "CREATE") {
      if (!webhookUrl) return;

      let messageText = "";
      if (type === "CREATE") {
        messageText = `🚗 *[가덕 YWAM BASE 차량 예약 알림]*\n• **차량**: ${resData.vehicle}\n• **신청자**: ${resData.userName} (${resData.dept})\n• **일시**: ${resData.startDate} ${resData.startTime} ~ ${resData.endDate} ${resData.endTime}\n• **목적**: ${resData.purpose}\n• **연락처**: ${resData.phone}`;
      } else {
        messageText = `❌ *[가덕 YWAM BASE 차량 예약 취소]*\n• **차량**: ${resData.vehicle}\n• **취소자**: ${resData.userName} (${resData.dept})\n• **일시**: ${resData.startDate} ${resData.startTime} ~ ${resData.endDate} ${resData.endTime}`;
      }

      fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: messageText })
      }).catch(err => console.error("Webhook Error:", err));
    }

    function renderReservationList() {
      const container = document.getElementById("reservationListContainer");
      container.innerHTML = "";

      document.getElementById("totalResCount").textContent = `총 ${reservations.length}건`;

      if (reservations.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 text-center py-8">등록된 예약이 없습니다.</p>`;
        return;
      }

      reservations.slice().reverse().forEach(res => {
        const card = document.createElement("div");
        card.className = "bg-card p-4 rounded-xl border border-gray-800 space-y-2 text-xs relative";

        card.innerHTML = `
          <div class="flex justify-between items-center border-b border-gray-800 pb-2 pr-12">
            <span class="font-bold text-emerald-400 text-sm">${res.vehicle}</span>
            <span class="text-gray-400 text-[11px]">${res.startDate} (${res.startTime}) ~ ${res.endDate} (${res.endTime})</span>
          </div>
          <button class="delete-btn absolute top-3.5 right-3 bg-red-900/40 hover:bg-red-800 text-red-300 border border-red-700/50 px-2 py-1 rounded text-[11px] transition-all">
            삭제
          </button>
          <div class="text-gray-300 space-y-0.5">
            <p><strong>신청자:</strong> ${res.userName} (${res.dept})</p>
            <p><strong>연락처:</strong> ${res.phone}</p>
            <p><strong>목적:</strong> ${res.purpose}</p>
          </div>
        `;

        card.querySelector(".delete-btn").addEventListener("click", () => deleteReservation(res));
        container.appendChild(card);
      });
    }

    document.getElementById("prevMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    const tabReserve = document.getElementById("tabReserve");
    const tabList = document.getElementById("tabList");
    const viewReserve = document.getElementById("viewReserve");
    const viewList = document.getElementById("viewList");

    tabReserve.addEventListener("click", () => {
      tabReserve.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 font-bold";
      tabList.className = "flex-1 py-3 text-center text-gray-400 hover:text-gray-200";
      viewReserve.classList.remove("hidden");
      viewList.classList.add("hidden");
    });

    tabList.addEventListener("click", () => {
      tabList.className = "flex-1 py-3 text-center border-b-2 border-emerald-500 text-emerald-400 font-bold";
      tabReserve.className = "flex-1 py-3 text-center text-gray-400 hover:text-gray-200";
      viewList.classList.remove("hidden");
      viewReserve.classList.add("hidden");
    });

    const settingsModal = document.getElementById("settingsModal");
    document.getElementById("openSettingsBtn").addEventListener("click", () => settingsModal.classList.remove("hidden"));
    document.getElementById("closeSettingsBtn").addEventListener("click", () => settingsModal.classList.add("hidden"));
    
    document.getElementById("saveSettingsBtn").addEventListener("click", () => {
      const webhookVal = document.getElementById("webhookInput").value.trim();
      const fbVal = document.getElementById("firebaseConfigInput").value.trim();

      localStorage.setItem("google_chat_webhook", webhookVal);
      localStorage.setItem("firebase_config", fbVal);

      webhookUrl = webhookVal;
      firebaseConfigRaw = fbVal;

      alert("설정이 저장되었습니다. 페이지가 새로고침 됩니다.");
      location.reload();
    });
  </script>
</body>
</html>
